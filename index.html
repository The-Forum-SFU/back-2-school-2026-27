<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo/bear_head.png" />
    <!--
      The full lockup, per the build plan's naming rule: the page title and every link
      preview carry "Rewind: SFU's Biggest Back to School Party" together, because
      "Rewind" alone means nothing to anyone who has not seen the campaign.

      This title is static, so it is also what the guestlist route shows. That is
      deliberate: a title naming the discount would be the one part of a private page
      that follows a shared screenshot around.
    -->
    <title>Rewind: SFU's Biggest Back to School Party</title>
    <meta
      name="description"
      content="Sunday, September 20 at Celebrities Nightclub. Eight hundred SFU students, throwback and pop all night, and the last free weekend before the term starts. 19+."
    />
    <meta property="og:title" content="Rewind: SFU's Biggest Back to School Party" />
    <meta
      property="og:description"
      content="Sunday, September 20 at Celebrities Nightclub. 19+."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/hero/hero-base.jpg" />
    <link rel="preload" as="image" href="/hero/hero-reveal.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
