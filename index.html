<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo/bear_head.png" />
    <!--
      The full lockup, per the build plan's naming rule: the page title and every link
      preview carry "Rewind: SFU's Biggest Back to School Party" together, because
      "Rewind" alone means nothing to anyone who has not seen the campaign.

      This title is static, so it is also what the guestlist route shows. That is
      deliberate: a title naming the discount would be the one part of a private page
      that follows a shared screenshot around.
    -->
    <title>Rewind: SFU's Biggest Back to School Party</title>
    <meta
      name="description"
      content="Sunday, September 20 at Celebrities Nightclub. Eight hundred SFU students, throwback and pop all night, and the last free weekend before the term starts. 19+."
    />
    <meta property="og:title" content="Rewind: SFU's Biggest Back to School Party" />
    <meta
      property="og:description"
      content="Sunday, September 20 at Celebrities Nightclub. 19+."
    />
    <meta property="og:type" content="website" />
    <!--
      The canonical address to share, and deliberately the ROOT rather than the current
      path. This is a single-page app behind a catch-all rewrite, so every route is served
      this same document, and a crawler does not run the JS that would make a per-route
      value possible. One correct value for the campaign beats a value that is right on
      one route and wrong on four.

      Not paired with a <link rel="canonical">. Google DOES run the JS, self-canonicalises
      to the URL it fetched, and a static canonical here would tell it that /privacy and
      /tickets are duplicates of the landing page and deindex both.
    -->
    <meta property="og:url" content="https://rewind.theforumuniversity.com/" />
    <!--
      The link preview image. There was none at all before the campaign art existed, so
      every share of this URL rendered as a bare text card, which on Instagram and iMessage
      is most of what a link looks like.

      The 16:9 poster crop rather than the 4:5 one: 1.91:1 is what Facebook, iMessage and
      Twitter all crop toward, and a portrait source gets its top and bottom taken off,
      which on this artwork is the wordmark and the venue line. JPEG rather than WebP
      because several crawlers still do not decode it.

      ABSOLUTE, as the spec requires. This was root-relative while the event had no host
      of its own: Facebook, iMessage and Twitter all resolve a relative og:image against
      the page origin, but smaller scrapers do not, and no absolute value would have been
      right for both the coming subdomain and the preview deploys. The subdomain is live,
      so the trade is over and correctness wins.

      The cost is that preview deployments now advertise the production image, which is
      the right way round: a preview's card being slightly wrong is invisible, and a
      production share rendering as a bare text card is the thing people see.

      Changing this needs a re-scrape in Facebook's sharing debugger. It caches hard, and
      a URL already shared keeps its old card until something asks for a new one.
    -->
    <meta property="og:image" content="https://rewind.theforumuniversity.com/event/poster-og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="675" />
    <meta
      property="og:image:alt"
      content="Rewind: SFU's Biggest Back to School Party. Sunday, September 20 at Celebrities Nightclub."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rewind: SFU's Biggest Back to School Party" />
    <meta
      name="twitter:description"
      content="Sunday, September 20 at Celebrities Nightclub. 19+."
    />
    <meta name="twitter:image" content="https://rewind.theforumuniversity.com/event/poster-og.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/hero/hero-base.jpg" />
    <link rel="preload" as="image" href="/hero/hero-reveal.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
